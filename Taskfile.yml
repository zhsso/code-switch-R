version: '3'

tasks:
  build:
    desc: Build the local linux/amd64 Docker image
    cmds:
      - docker compose build

  up:
    desc: Build and start Codex++ with the persistent named volume
    cmds:
      - docker compose up --build -d

  down:
    desc: Stop Codex++ without deleting its data volume
    cmds:
      - docker compose down

  logs:
    desc: Follow container logs
    cmds:
      - docker compose logs -f codeswitch

  status:
    desc: Show container and health status
    cmds:
      - docker compose ps

  test:
    desc: Run source checks used by the Docker build
    cmds:
      - go test ./...
      - go vet ./...
      - cd frontend && npm ci && npm run build
      - docker compose config --quiet
